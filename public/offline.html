<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="robots" content="noindex" />
    <title>You're offline · Flixtally</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #0a0c10;
        color: #f2f4f7;
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: #a3aebb;
        line-height: 1.55;
      }
      button {
        margin-top: 24px;
        min-height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 12px;
        background: #00e054;
        color: #04130a;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Flixtally needs a connection to load your films. This page will reload by itself when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
